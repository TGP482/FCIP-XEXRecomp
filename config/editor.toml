# instruction hooks, defined in src/editor/draw_distance.cpp

# jump tables the scan cannot bound: the index's check is before a join 
[[switch]]
at = 0x826AF904  # halfword offsets at 0x82033918 from 0x826AF5AC, index checked <= 14 at 0x826AF878
targets = [0x826AF948, 0x826AF950, 0x826AF958, 0x826AF960, 0x826AF968, 0x826AF970, 0x826AF978, 0x826AF980,
           0x826AF988, 0x826AF990, 0x826AF998, 0x826AF9A4, 0x826AF9AC, 0x826AF9B4, 0x826AF9BC]

[[hook]]  # the grass tile budget compare: r11 tiles, r29 renderer, r27 params
at = 0x82494120
call = "GrassTileBudget"

[[hook]]  # the grass cache scan, replaced
at = 0x8249414C
call = "GrassTileLookup"
on_true = 0x824942E4
on_false = 0x82494200

[[hook]]  # the grass miss path after the blade copy, before the unlock
at = 0x824942DC
call = "GrassTileRefilled"

[[hook]]  # f28 = engine+0xB30 in the grass tile loop
at = 0x82356BC4
call = "GrassRadius"

[[hook]]  # f1 = the sun shadow radius walk target
at = 0x82338AC4
call = "ShadowRadiusTarget"
regs = ["f1"]

[[hook]]  # f8 = the sun light radius
at = 0x823EAAD8
call = "ShadowRadiusLight"

[[hook]]  # f0 = the radius tested against the distance
at = 0x82355668
call = "ShadowRadiusRange"

# instruction hooks, defined in src/common/fpsfixes.cpp
[[hook]]  # f13 = frame time in milliseconds, the menu input's truncation
at = 0x8219137C
call = "WholeFrameMsF13"
regs = ["f13"]

[[hook]]  # f10 = the same for each pad's input
at = 0x821913B0
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f13 = the same for the menu manager's first page update
at = 0x821918EC
call = "WholeFrameMsF13"
regs = ["f13"]

[[hook]]  # f10 = the same for its second page update
at = 0x8219195C
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f10 = the same for the UI update at the end of sub_821F33E8
at = 0x821F3B0C
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f12 = 0.075, the least rise per call of a living entity's shown height stepping up
at = 0x82447A7C
call = "StepUpRate"
regs = ["f12"]
after = true

[[hook]]  # f0 = 1e-6, the least squared move a living entity's step makes
at = 0x8244DE3C
call = "LeastMove"
regs = ["f0", "r22"]
after = true

[[hook]]  # the ladder's top exit, just before it lets go: r30 the player
at = 0x82167468
call = "LadderTopExit"
regs = ["r30"]

[[hook]]  # the continuous emitters' spawn call: r3 the emitter, f1 the frame time
at = 0x8240026C
call = "ScaleEmitterCount"
regs = ["r3", "f1"]

[[hook]]  # after it, also the out of view branch's target
at = 0x82400270
call = "RestoreEmitterCount"
regs = []

[[hook]]  # f1 = the frame time in the path point arrival test
at = 0x822ECDFC
call = "ArrivalFrameTime"
regs = ["f1"]

[[hook]]  # f13 = 6.0, the degrees the loading screen's spinner turns each draw
at = 0x8211577C
call = "LoadingIconTurn"
regs = ["f13"]

[[hook]]  # r31 = the loading screen fade out's alpha, just stepped down by 10 after its draw
at = 0x82115F30
call = "LoadingFadeStep"
regs = ["r31"]
after = true

[[hook]]  # f27 = p_waterbob_pitch, before the pitch adds sine times depth times it
at = 0x82174DE4
call = "WaterBobPitch"
regs = ["f27"]

[[hook]]  # f26 = p_waterbob_roll, f31 = depth past p_waterbob_mindepth in 0..1, before the roll adds and scales
at = 0x82174DF8
call = "WaterBobRoll"
regs = ["f26", "f31"]

[[hook]]  # f9 = Dampv and f10 = Dampvs, a boat's forward and sideways drag share per physics step, f29 the step
at = 0x8217E578
call = "BoatDrag"
regs = ["f9", "f10", "f29"]
after = true

# instruction hooks, defined in src/common/screen_quads.cpp
[[hook]]  # the full screen quad's draw: r6 its vertices, r29 set when it copies a texture, r22 a second one
at = 0x82372F4C
call = "RestoreQuads"
regs = ["r6", "r22", "r29"]

[[hook]]  # a 2D image's vertices built on its stack, before they join the batch
at = 0x8235E354
call = "ImageQuad"
regs = ["r1"]

