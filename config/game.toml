# instruction hooks, defined in src/game/draw_distance.cpp

# jump tables the scan cannot bound: the index's check is before a join 
[[switch]]
at = 0x826960DC  # halfword offsets at 0x8200DB50 from 0x82695D84, index checked <= 14 at 0x82696050
targets = [0x82696120, 0x82696128, 0x82696130, 0x82696138, 0x82696140, 0x82696148, 0x82696150, 0x82696158,
           0x82696160, 0x82696168, 0x82696170, 0x8269617C, 0x82696184, 0x8269618C, 0x82696194]

[[hook]]  # the grass tile budget compare: r11 tiles, r30 renderer, r27 params
at = 0x82373430
call = "GrassTileBudget"

[[hook]]  # the grass cache scan, replaced
at = 0x8237345C
call = "GrassTileLookup"
on_true = 0x823735E0
on_false = 0x8237351C

[[hook]]  # the grass miss path after the blade copy, before the unlock
at = 0x823735D8
call = "GrassTileRefilled"

[[hook]]  # f24 = engine+0xB30 in the grass tile loop
at = 0x825FF23C
call = "GrassRadius"
regs = ["f24"]

[[hook]]  # after the sector ring test
at = 0x825EB5B8
call = "GrassSectorRing"
regs = ["r11", "r20", "r21", "r25", "r27", "r28", "r29", "r30"]

[[hook]]  # f0 = the sun shadow radius walk target
at = 0x825D3ED8
call = "ShadowRadiusTarget"
regs = ["f0"]

[[hook]]  # f8 = the sun light radius
at = 0x825C5DD4
call = "ShadowRadiusLight"
regs = ["f8"]

[[hook]]  # f1 = the radius tested against the distance
at = 0x825FAFA8
call = "ShadowRadiusRange"
regs = ["f1"]

[[hook]]  # r3 = a sector entity's render flags, the shadow pass's cast test
at = 0x825D65D8
call = "CastShadowMaps"
regs = ["r3"]

[[hook]]  # r3 = a sector render node's flags, the same test
at = 0x825FADA8
call = "CastShadowMaps"
regs = ["r3"]

[[hook]]  # r5 = a render item's shadow enabled bit, from its flags
at = 0x82387C5C
call = "ReceiveShadowMaps"
regs = ["r5"]
after = true


# instruction hooks, defined in src/game/fpsfixes.cpp
[[hook]]  # f13 = frame time in milliseconds, the menu input's truncation
at = 0x82130818
call = "WholeFrameMsF13"
regs = ["f13"]

[[hook]]  # f10 = the same for each pad's input
at = 0x8213084C
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f13 = the same for the menu manager's first page update
at = 0x82130D8C
call = "WholeFrameMsF13"
regs = ["f13"]

[[hook]]  # f10 = the same for its second page update
at = 0x82130DFC
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f10 = the same for the UI update at the end of sub_822248F8
at = 0x822250F8
call = "WholeFrameMsF10"
regs = ["f10"]

[[hook]]  # f12 = 0.075, the least rise per call of a living entity's shown height stepping up
at = 0x8254D6B4
call = "StepUpRate"
regs = ["f12"]
after = true

[[hook]]  # f0 = 1e-6, the least squared move a living entity's step makes
at = 0x82552410
call = "LeastMove"
regs = ["f0", "r22"]
after = true

[[hook]]  # the ladder's top exit, just before it lets go: r29 the player
at = 0x82261958
call = "LadderTopExit"
regs = ["r29"]

[[hook]]  # the continuous emitters' spawn call: r3 the emitter, f1 the frame time
at = 0x825D88A4
call = "ScaleEmitterCount"
regs = ["r3", "f1"]

[[hook]]  # after it, also the out of view branch's target
at = 0x825D88A8
call = "RestoreEmitterCount"
regs = []

[[hook]]  # f1 = the frame time in the path point arrival test
at = 0x822D355C
call = "ArrivalFrameTime"
regs = ["f1"]

[[hook]]  # f13 = 6.0, the degrees the loading screen's spinner turns each draw
at = 0x82156100
call = "LoadingIconTurn"
regs = ["f13"]

[[hook]]  # r31 = the loading screen fade out's alpha, just stepped down by 10 after its draw
at = 0x821568A4
call = "LoadingFadeStep"
regs = ["r31"]
after = true

[[hook]]  # f29 = p_waterbob_pitch, before the pitch adds sine times depth times it
at = 0x8226F838
call = "WaterBobPitch"
regs = ["f29"]

[[hook]]  # f28 = p_waterbob_roll, f30 = depth past p_waterbob_mindepth in 0..1, before the roll adds and scales
at = 0x8226F84C
call = "WaterBobRoll"
regs = ["f28", "f30"]

# instruction hooks, defined in src/common/screen_quads.cpp
[[hook]]  # the full screen quad's draw (EDRAM restore, fades): r6 its vertices, r23 set when it copies a texture
at = 0x823AE5EC
call = "RestoreQuad"
regs = ["r6", "r23"]

[[hook]]  # a 2D image's vertices built on its stack, before they join the batch
at = 0x82363754
call = "ImageQuad"
regs = ["r1"]

# instruction hooks, defined in src/game/virtual_keyboard.cpp
[[hook]]  # the virtual keyboard's accept, r31 the keyboard, before it calls its listener: closes or stays open
at = 0x82171C78
call = "VirtualKeyboardAccept"
on_true = 0x82171C98
on_false = 0x82171EC8

# instruction hooks, defined in src/game/profiles.cpp
[[hook]]  # r4 = 1, the page CryProfile opens on; the list comes first
at = 0x821E32C8
call = "ProfileListFirst"
regs = ["r4"]

# instruction hooks, defined in src/game/user_maps.cpp
[[hook]]  # the join's user map lookup, r10 found, r27 its name: a missing one joins and downloads as the map loads
at = 0x82228290
call = "JoinMissingUserMap"
on_true = 0x82228460
regs = ["r10", "r27"]
